name: VidLex — сборка и тесты (Windows)

on:
  push:
    paths:
      - "VidLex/**"
      - ".github/workflows/vidlex-windows.yml"
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: "Сохранить скриншоты интерфейса в VidLex/docs/screenshots этой ветки"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DEPS: ${{ github.workspace }}\vidlex-deps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Сборка (Release, .NET Framework 4.8 + net8.0)
        run: dotnet build VidLex/VidLex.sln -c Release

      - name: Модульные тесты (net48 и net8.0)
        run: dotnet test VidLex/tests/VidLex.Core.Tests/VidLex.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=minimal" --results-directory artifacts/tests

      - name: Кэш компонентов (FFmpeg, whisper.cpp, модель)
        uses: actions/cache@v4
        with:
          path: vidlex-deps
          key: vidlex-deps-small-v1

      - name: Установка компонентов скриптом Install-Dependencies.ps1 (Windows PowerShell 5.1)
        id: deps
        shell: powershell
        run: |
          VidLex\scripts\Install-Dependencies.ps1 -Model small -DataDir "$env:DEPS"
          & "$env:DEPS\tools\whisper\whisper-cli.exe" --help | Select-Object -First 3
          Get-Content "$env:DEPS\tools\whisper\VERSION.txt" -ErrorAction SilentlyContinue

      - name: Сквозные тесты VidLex.Cli (net48, настоящий whisper.cpp)
        shell: pwsh
        run: |
          python VidLex/tests/e2e/e2e_check.py `
            --cli "VidLex\tools\VidLex.Cli\bin\Release\net48\VidLex.Cli.exe" `
            --media VidLex/tests/e2e/media --work "$env:RUNNER_TEMP\e2e" `
            --model "$env:DEPS\Models\ggml-small.bin" `
            --whisper "$env:DEPS\tools\whisper\whisper-cli.exe" `
            --ffmpeg "$env:DEPS\tools\ffmpeg\ffmpeg.exe" --ffprobe "$env:DEPS\tools\ffmpeg\ffprobe.exe"

      - name: Проверка интерфейса (запуск без компонентов)
        if: ${{ !cancelled() }}
        shell: powershell
        run: VidLex\scripts\ci\Run-GuiChecks.ps1 -Mode NoDeps -Repo "$env:GITHUB_WORKSPACE" -Temp "$env:RUNNER_TEMP"

      - name: Проверка интерфейса (обработка папки из GUI)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        shell: powershell
        run: VidLex\scripts\ci\Run-GuiChecks.ps1 -Mode Full -Repo "$env:GITHUB_WORKSPACE" -Temp "$env:RUNNER_TEMP" -Deps "$env:DEPS"

      - name: Release-сборка с компонентами
        if: always()
        shell: powershell
        run: VidLex\scripts\Build-Release.ps1 -IncludeTools -DataDir "$env:DEPS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidlex-windows
          path: |
            artifacts/screenshots
            artifacts/tests
            artifacts/gui-logs
            VidLex/artifacts/*.zip
          if-no-files-found: warn

      - name: Публикация скриншотов в ветку (ручной запуск)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_screenshots }}
        shell: bash
        run: |
          mkdir -p VidLex/docs/screenshots
          cp artifacts/screenshots/*.png VidLex/docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VidLex/docs/screenshots
          git commit -m "VidLex: скриншоты интерфейса из CI (Windows) [skip ci]" || echo "Изменений нет"
          git push origin HEAD:${GITHUB_REF_NAME}
